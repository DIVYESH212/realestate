<div class="h-screen w-screen flex items-center justify-center bg-[#0c1b22] p-6">
  <div class="w-full max-w-md rounded-3xl bg-white shadow-2xl p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Forgot Password</h2>
    <p class="text-sm text-gray-600 mb-6">Enter your account email and we'll send a reset link.</p>

    <div *ngIf="error()" class="mb-4 rounded-lg bg-rose-50 border border-rose-200 px-4 py-3 text-rose-700">
      {{ error() }}
    </div>
    <div *ngIf="message()" class="mb-4 rounded-lg bg-emerald-50 border border-emerald-200 px-4 py-3 text-emerald-700">
      {{ message() }}
    </div>

    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
      <input
        type="email"
        placeholder="name@example.com"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        (keyup.enter)="onSubmit()"
        class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-900 outline-none transition focus:border-[#007a78]"
      />
    </div>

    <button
      (click)="onSubmit()"
      class="w-full rounded-xl bg-[#007a78] px-4 py-3 text-sm font-semibold text-white hover:bg-[#006a6a] transition"
    >
      Send reset link
    </button>

    <button
      (click)="backToLogin()"
      class="mt-4 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition"
    >
      Back to login
    </button>
  </div>
</div>
