<div class="h-screen w-screen flex items-center justify-center bg-[#0c1b22] p-6">
  <div class="w-full max-w-md rounded-3xl bg-white shadow-2xl p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Reset Password</h2>
    <p class="text-sm text-gray-600 mb-6">Set a new password for your account.</p>

    <div *ngIf="error()" class="mb-4 rounded-lg bg-rose-50 border border-rose-200 px-4 py-3 text-rose-700">
      {{ error() }}
    </div>
    <div *ngIf="message()" class="mb-4 rounded-lg bg-emerald-50 border border-emerald-200 px-4 py-3 text-emerald-700">
      {{ message() }}
    </div>

    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-600 mb-1">New Password</label>
      <div class="relative">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          (keyup.enter)="onSubmit()"
          class="w-full rounded-xl border border-gray-200 pl-4 pr-10 py-3 text-sm text-gray-900 outline-none transition focus:border-[#007a78]"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-[#007a78] bg-transparent border-none outline-none cursor-pointer"
        >
          <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        </button>
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-xs font-semibold text-gray-600 mb-1">Confirm Password</label>
      <input
        [type]="showPassword() ? 'text' : 'password'"
        placeholder="••••••••"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        (keyup.enter)="onSubmit()"
        class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-900 outline-none transition focus:border-[#007a78]"
      />
    </div>

    <button
      (click)="onSubmit()"
      [disabled]="loading()"
      class="w-full rounded-xl bg-[#007a78] px-4 py-3 text-sm font-semibold text-white hover:bg-[#006a6a] transition disabled:opacity-50"
    >
      {{ loading() ? 'Resetting...' : 'Reset password' }}
    </button>

    <button
      (click)="backToLogin()"
      class="mt-4 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition"
    >
      Back to login
    </button>
  </div>
</div>
